spring.application.name=greenride-backend


# ------------------------------------
# 1. PostgreSQL Connection Details
# ------------------------------------
# The driver class name for PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
# The standard JDBC URL format for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/greenride_db
# PostgreSQL database username
spring.datasource.username=postgres
# PostgreSQL database password
spring.datasource.password=160723@rd

# ------------------------------------
# 2. JPA/Hibernate Configuration
# ------------------------------------
# Specifies the dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto setting: CRUCIAL for initial setup!
# - create-drop: Creates schema, drops on exit (good for testing).
# - update: Updates schema based on entity changes (good for development).
# - validate: Checks schema but makes no changes (good for production).
spring.jpa.hibernate.ddl-auto=update 

# Show SQL statements in the console (useful for debugging)
spring.jpa.show-sql=true
# Format the SQL to be more readable
spring.jpa.properties.hibernate.format_sql=true

# The port where your application will run (default is 8080)
server.port=8080

#for logs to debug the application
logging.level.org.springframework.security=DEBUG
# JWT Configuration
greenride.app.jwtSecret=YOUR_ULTRA_SECURE_SECRET_KEY_GOES_HERE_AT_LEAST_32_CHARS
greenride.app.jwtExpirationMs=86400000
